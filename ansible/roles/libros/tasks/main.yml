- name: Carpeta de la aplicación
  ansible.builtin.file:
    path: "{{ app_dir }}"
    state: directory
    mode: "0750"

- name: Variables de entorno (credenciales de RDS)
  ansible.builtin.template:
    src: libros.env.j2
    dest: "{{ app_dir }}/libros.env"
    mode: "0600"

- name: Definición del contenedor
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ app_dir }}/docker-compose.yml"
    mode: "0644"

- name: Descargar imagen de ECR y levantar contenedor
  ansible.builtin.command: docker compose up -d --pull always --remove-orphans
  args:
    chdir: "{{ app_dir }}"
  register: compose
  changed_when: "'Started' in compose.stderr or 'Recreated' in compose.stderr"

# El servicio crea la tabla al arrancar; hay que esperar antes de sembrar datos
- name: Esperar a que libros-service responda
  ansible.builtin.uri:
    url: http://localhost:3001/health
  register: salud
  until: salud.status == 200
  retries: 30
  delay: 5

- name: Copiar datos iniciales del catálogo
  ansible.builtin.copy:
    src: seed.sql
    dest: "{{ app_dir }}/seed.sql"
    mode: "0644"

- name: Cargar catálogo inicial en RDS (solo si la tabla está vacía)
  ansible.builtin.command: >-
    docker run --rm --env-file {{ app_dir }}/libros.env
    -v {{ app_dir }}/seed.sql:/seed.sql:ro
    postgres:16-alpine
    psql -v ON_ERROR_STOP=1 -f /seed.sql
  register: seed
  changed_when: "'INSERT 0 0' not in seed.stdout"
